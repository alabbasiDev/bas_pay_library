#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
org.gradle.caching=true
org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

org.gradle.parallel=false

# Library version for Maven coordinates (vanniktech / Gradle publishing).
VERSION_NAME=0.0.3

# GitHub Packages: owner/repo for https://maven.pkg.github.com/OWNER/REPO
# BasPlatform org — packages attach to this GitHub repo (see https://github.com/BasPlatform ).
# Override if you publish under another repo (e.g. after adding bas_pay_library on GitHub).
# CI: ./gradlew publish "-Pgpr.github.repo=${{ github.repository }}"
gpr.github.repo=BasPlatform/BasPaymentAndroidSdk